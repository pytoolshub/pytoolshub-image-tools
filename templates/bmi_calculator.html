{% extends 'base.html' %}

{% block title %}
BMI Calculator - PyToolsHub
{% endblock %}

{% block description %}
Calculate your Body Mass Index online for free.
{% endblock %}

{% block content %}

<div class="container py-5">

```
<h1 class="text-center mb-4">

    BMI Calculator

</h1>

<div class="card shadow p-4">

    <label>

        Weight (KG)

    </label>

    <input type="number"
           id="weight"
           class="form-control">

    <label class="mt-3">

        Height (CM)

    </label>

    <input type="number"
           id="height"
           class="form-control">

    <button class="btn btn-success mt-3"
            onclick="calculateBMI()">

        Calculate BMI

    </button>

    <h4 class="mt-4"
        id="result"></h4>

</div>
```

</div>

<script>

function calculateBMI(){

    let weight =
        parseFloat(
            document.getElementById("weight").value
        );

    let height =
        parseFloat(
            document.getElementById("height").value
        ) / 100;

    let bmi =
        weight /
        (height * height);

    document.getElementById("result")
        .innerHTML =
        "BMI: " +
        bmi.toFixed(2);

}

</script>

{% endblock %}
